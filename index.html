<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watched</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📺</text></svg>">
</head>
<body>
  <header>
    <h3>shivi's television show database</h3>
    <p>series I've completed or watched at least halfway through.</p>

    <div id="controls-row">
      <input type="text" id="search" placeholder="search shows..." aria-label="Search shows" />

      <div class="checkbox-filters">
        <label class="filter-chip"><input type="checkbox" id="book-filter"><span>Based on a Book</span></label>
        <label class="filter-chip"><input type="checkbox" id="supernatural-filter"><span>SciFi / Supernatural</span></label>
        <label class="filter-chip"><input type="checkbox" id="period-filter"><span>Historical</span></label>
        <label class="filter-chip"><input type="checkbox" id="scandi-filter"><span>Scandinavian</span></label>
        <label class="filter-chip"><input type="checkbox" id="mini-filter"><span>Mini-series</span></label>
        <label class="filter-chip"><input type="checkbox" id="animated-filter"><span>Animated</span></label>
        <label class="filter-chip"><input type="checkbox" id="therapist-filter"><span>Features a Therapist</span></label>
        <label class="filter-chip"><input type="checkbox" id="pwd-filter"><span>Includes Person with Disability</span></label>
        <label class="filter-chip"><input type="checkbox" id="comedian-filter"><span>Comedian</span></label>
        <label class="filter-chip"><input type="checkbox" id="essential-filter"><span>Essential</span></label>
        <label class="filter-chip"><input type="checkbox" id="gem-filter"><span>💎</span></label>
        <button id="reset-filters" type="button" hidden></button>
      </div>
    </div>
  </header>

  <div class="content-controls">
    <select id="region-filter" aria-label="Region">
      <option value="all">All Regions</option>
    </select>

    <label class="sort-toggle">
      <input id="sort-toggle" type="checkbox" aria-label="Sort alphabetically">
      <div class="sort-switch">
        <div class="sort-option left">Chronological</div>
        <div class="sort-option right">Alphabetical</div>
      </div>
    </label>
  </div>

  <main id="shows-container">
    <div class="loading">Loading collection...skip intro not available.</div>
  </main>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
